openapi: 3.0.3
info:
  title: Secunda — API управления задачами
  version: 1.0.0
  description: |
    REST API для управления задачами внутри команд.

    Аутентификация — JWT Bearer. Все эндпоинты, кроме `/register` и `/login`,
    требуют заголовок `Authorization: Bearer <token>`.

    Ошибки возвращаются в едином формате `{"error": {...}}`.
servers:
  - url: /api/v1
    description: Текущий сервер
tags:
  - name: auth
    description: Регистрация и аутентификация
  - name: teams
    description: Команды и участники
  - name: tasks
    description: Задачи, история и комментарии
  - name: stats
    description: SQL-аналитика по команде
security:
  - bearerAuth: []

paths:
  /register:
    post:
      tags: [auth]
      operationId: register
      summary: Регистрация пользователя
      description: Создаёт пользователя и сразу выдаёт JWT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /login:
    post:
      tags: [auth]
      operationId: login
      summary: Аутентификация
      description: Проверяет email и пароль, возвращает JWT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /teams:
    post:
      tags: [teams]
      operationId: createTeam
      summary: Создание команды
      description: Текущий пользователь становится создателем (owner) команды.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
      responses:
        '201':
          description: Команда создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [teams]
      operationId: listTeams
      summary: Список команд пользователя
      description: Возвращает только команды, где текущий пользователь является участником.
      responses:
        '200':
          description: Список команд
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /teams/{id}/invite:
    post:
      tags: [teams]
      operationId: inviteMember
      summary: Приглашение пользователя в команду
      description: |
        Доступно создателю (owner) и администратору команды.
        Owner может приглашать с ролью `admin` или `member`,
        admin — только с ролью `member`. Роль `owner` не выдаётся.
      parameters:
        - $ref: '#/components/parameters/TeamID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMemberRequest'
      responses:
        '201':
          description: Пользователь добавлен в команду
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /teams/{team_id}/stats:
    get:
      tags: [stats]
      operationId: getTeamStats
      summary: Статистика команды
      description: |
        SQL-отчёт по одной команде. Доступен только создателю (owner) или
        администратору (admin) команды; остальные участники получают 403,
        не участники — 404.

        `top_assignees` — до трёх исполнителей по количеству задач в статусе
        `done`, закрытых за последние 30 дней. `average_close_seconds` —
        среднее время от создания до закрытия по всем завершённым задачам,
        в секундах; `null`, если завершённых задач нет.
      parameters:
        - $ref: '#/components/parameters/TeamIDPath'
      responses:
        '200':
          description: Статистика команды
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamStatsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks:
    post:
      tags: [tasks]
      operationId: createTask
      summary: Создание задачи
      description: |
        Любой участник команды может создать задачу. Создателем считается
        текущий пользователь. Исполнитель должен быть участником этой же команды.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Задача создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [tasks]
      operationId: listTasks
      summary: Список задач команды
      description: |
        Требует `team_id` и участия в команде. Результат кешируется в Redis
        на 5 минут с учётом команды и фильтров.
      parameters:
        - $ref: '#/components/parameters/TeamIDQuery'
        - $ref: '#/components/parameters/TaskStatusQuery'
        - $ref: '#/components/parameters/AssigneeIDQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/OffsetQuery'
      responses:
        '200':
          description: Список задач
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks/{id}:
    put:
      tags: [tasks]
      operationId: updateTask
      summary: Обновление задачи
      description: |
        Проверяет права на уровне полей и пишет историю изменений в той же
        транзакции. Поле `version` обязательно: конкурентные обновления
        сериализуются блокировкой строки, устаревшая версия даёт 409.
        `assignee_id: 0` снимает исполнителя.
      parameters:
        - $ref: '#/components/parameters/TaskID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Задача обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks/{id}/history:
    get:
      tags: [tasks]
      operationId: listTaskHistory
      summary: История изменений задачи
      description: Доступна только участникам команды задачи.
      parameters:
        - $ref: '#/components/parameters/TaskID'
      responses:
        '200':
          description: История изменений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks/{id}/comments:
    post:
      tags: [comments]
      operationId: addTaskComment
      summary: Добавление комментария
      description: Комментировать может любой участник команды задачи.
      parameters:
        - $ref: '#/components/parameters/TaskID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskCommentRequest'
      responses:
        '201':
          description: Комментарий добавлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskComment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [comments]
      operationId: listTaskComments
      summary: Комментарии задачи
      description: Доступны только участникам команды задачи.
      parameters:
        - $ref: '#/components/parameters/TaskID'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/OffsetQuery'
      responses:
        '200':
          description: Список комментариев
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCommentsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TeamID:
      name: id
      in: path
      required: true
      description: Идентификатор команды
      schema:
        type: integer
        format: int64
        minimum: 1
    TeamIDPath:
      name: team_id
      in: path
      required: true
      description: Идентификатор команды
      schema:
        type: integer
        format: int64
        minimum: 1
    TaskID:
      name: id
      in: path
      required: true
      description: Идентификатор задачи
      schema:
        type: integer
        format: int64
        minimum: 1
    TeamIDQuery:
      name: team_id
      in: query
      required: true
      description: Идентификатор команды
      schema:
        type: integer
        format: int64
        minimum: 1
    TaskStatusQuery:
      name: status
      in: query
      required: false
      description: Фильтр по статусу
      schema:
        $ref: '#/components/schemas/TaskStatus'
    AssigneeIDQuery:
      name: assignee_id
      in: query
      required: false
      description: Фильтр по исполнителю
      schema:
        type: integer
        format: int64
        minimum: 1
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Размер страницы
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    OffsetQuery:
      name: offset
      in: query
      required: false
      description: Смещение
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    BadRequest:
      description: Некорректный запрос или ошибка валидации
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Требуется аутентификация или токен недействителен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Конфликт состояния ресурса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Тело запроса превышает 1 MiB
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: secret123
        name:
          type: string
          maxLength: 100
          example: Иван Петров

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: user@example.com
        password:
          type: string
          format: password
          example: secret123

    AuthResponse:
      type: object
      required: [token, expires_at, user]
      properties:
        token:
          type: string
          description: JWT access-токен
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, email, name, created_at]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: user@example.com
        name:
          type: string
          example: Иван Петров
        created_at:
          type: string
          format: date-time

    Role:
      type: string
      enum: [owner, admin, member]

    InviteRole:
      type: string
      enum: [admin, member]

    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          example: Платформа

    Team:
      type: object
      required: [id, name, created_by, created_at]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Платформа
        created_by:
          type: integer
          format: int64
          example: 1
        created_at:
          type: string
          format: date-time

    TeamWithRole:
      type: object
      required: [id, name, created_by, created_at, role]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Платформа
        created_by:
          type: integer
          format: int64
          example: 1
        created_at:
          type: string
          format: date-time
        role:
          $ref: '#/components/schemas/Role'

    TeamsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamWithRole'

    InviteMemberRequest:
      type: object
      required: [user_id, role]
      properties:
        user_id:
          type: integer
          format: int64
          minimum: 1
          example: 2
        role:
          $ref: '#/components/schemas/InviteRole'

    TeamMember:
      type: object
      required: [team_id, user_id, role]
      properties:
        team_id:
          type: integer
          format: int64
          example: 1
        user_id:
          type: integer
          format: int64
          example: 2
        role:
          $ref: '#/components/schemas/Role'

    TeamStatsResponse:
      type: object
      required: [team_id, tasks_by_status, top_assignees, average_close_seconds, comments_count]
      properties:
        team_id:
          type: integer
          format: int64
          example: 1
        tasks_by_status:
          $ref: '#/components/schemas/TasksByStatus'
        top_assignees:
          type: array
          description: До трёх исполнителей по закрытым за 30 дней задачам
          items:
            $ref: '#/components/schemas/TopAssignee'
        average_close_seconds:
          type: number
          format: double
          nullable: true
          description: Среднее время закрытия завершённых задач в секундах
          example: 86400.0
        comments_count:
          type: integer
          format: int64
          example: 12

    TasksByStatus:
      type: object
      required: [todo, in_progress, done, cancelled]
      properties:
        todo:
          type: integer
          format: int64
          example: 3
        in_progress:
          type: integer
          format: int64
          example: 2
        done:
          type: integer
          format: int64
          example: 10
        cancelled:
          type: integer
          format: int64
          example: 1

    TopAssignee:
      type: object
      required: [user_id, name, closed_tasks]
      properties:
        user_id:
          type: integer
          format: int64
          example: 2
        name:
          type: string
          example: Пётр
        closed_tasks:
          type: integer
          format: int64
          example: 5

    TaskStatus:
      type: string
      enum: [todo, in_progress, done, cancelled]

    CreateTaskRequest:
      type: object
      required: [team_id, title]
      properties:
        team_id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        title:
          type: string
          maxLength: 255
          example: Подготовить релиз
        description:
          type: string
          maxLength: 5000
          default: ""
          example: Собрать changelog и проверить миграции
        status:
          $ref: '#/components/schemas/TaskStatus'
        assignee_id:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          example: 2

    UpdateTaskRequest:
      type: object
      required: [version]
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 5000
        status:
          $ref: '#/components/schemas/TaskStatus'
        assignee_id:
          type: integer
          format: int64
          minimum: 0
          description: Новый исполнитель; 0 снимает исполнителя
        version:
          type: integer
          format: int64
          minimum: 1
          description: Ожидаемая версия задачи для optimistic locking

    Task:
      type: object
      required:
        - id
        - team_id
        - title
        - description
        - status
        - created_by
        - assignee_id
        - created_at
        - updated_at
        - closed_at
        - version
      properties:
        id:
          type: integer
          format: int64
          example: 10
        team_id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Подготовить релиз
        description:
          type: string
          example: Собрать changelog
        status:
          $ref: '#/components/schemas/TaskStatus'
        created_by:
          type: integer
          format: int64
          example: 1
        assignee_id:
          type: integer
          format: int64
          nullable: true
          example: 2
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
          format: int64
          example: 3

    TasksResponse:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        total:
          type: integer
          example: 42
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0

    TaskChange:
      type: object
      required: [field, old, new]
      properties:
        field:
          type: string
          example: status
        old:
          description: Предыдущее значение (строка, число или null)
        new:
          description: Новое значение (строка, число или null)

    TaskHistoryEntry:
      type: object
      required: [id, task_id, changed_by, changes, created_at]
      properties:
        id:
          type: integer
          format: int64
          example: 100
        task_id:
          type: integer
          format: int64
          example: 10
        changed_by:
          type: integer
          format: int64
          example: 1
        changes:
          type: array
          items:
            $ref: '#/components/schemas/TaskChange'
        created_at:
          type: string
          format: date-time

    TaskHistoryResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskHistoryEntry'

    CreateTaskCommentRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 5000
          example: Проверил миграции, всё ок

    TaskComment:
      type: object
      required: [id, task_id, user_id, content, created_at]
      properties:
        id:
          type: integer
          format: int64
          example: 5
        task_id:
          type: integer
          format: int64
          example: 10
        user_id:
          type: integer
          format: int64
          example: 2
        content:
          type: string
          example: Проверил миграции, всё ок
        created_at:
          type: string
          format: date-time

    TaskCommentsResponse:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskComment'
        total:
          type: integer
          example: 3
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'

    ErrorBody:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          example: forbidden
        message:
          type: string
          example: недостаточно прав
        request_id:
          type: string
          example: 4f8c2f1b9a3e4d5f
        details:
          type: object
          additionalProperties:
            type: string
          example:
            name: не более 100 символов
