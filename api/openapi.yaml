openapi: 3.0.3
info:
  title: Secunda — API управления задачами
  version: 1.0.0
  description: |
    REST API для управления задачами внутри команд.

    Аутентификация — JWT Bearer. Все эндпоинты, кроме `/register` и `/login`,
    требуют заголовок `Authorization: Bearer <token>`.

    Ошибки возвращаются в едином формате `{"error": {...}}`.
servers:
  - url: /api/v1
    description: Текущий сервер
tags:
  - name: auth
    description: Регистрация и аутентификация
  - name: teams
    description: Команды и участники
security:
  - bearerAuth: []

paths:
  /register:
    post:
      tags: [auth]
      operationId: register
      summary: Регистрация пользователя
      description: Создаёт пользователя и сразу выдаёт JWT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /login:
    post:
      tags: [auth]
      operationId: login
      summary: Аутентификация
      description: Проверяет email и пароль, возвращает JWT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /teams:
    post:
      tags: [teams]
      operationId: createTeam
      summary: Создание команды
      description: Текущий пользователь становится создателем (owner) команды.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
      responses:
        '201':
          description: Команда создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [teams]
      operationId: listTeams
      summary: Список команд пользователя
      description: Возвращает только команды, где текущий пользователь является участником.
      responses:
        '200':
          description: Список команд
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /teams/{id}/invite:
    post:
      tags: [teams]
      operationId: inviteMember
      summary: Приглашение пользователя в команду
      description: |
        Доступно создателю (owner) и администратору команды.
        Owner может приглашать с ролью `admin` или `member`,
        admin — только с ролью `member`. Роль `owner` не выдаётся.
      parameters:
        - $ref: '#/components/parameters/TeamID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMemberRequest'
      responses:
        '201':
          description: Пользователь добавлен в команду
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TeamID:
      name: id
      in: path
      required: true
      description: Идентификатор команды
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    BadRequest:
      description: Некорректный запрос или ошибка валидации
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Требуется аутентификация или токен недействителен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Конфликт состояния ресурса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: secret123
        name:
          type: string
          maxLength: 100
          example: Иван Петров

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: user@example.com
        password:
          type: string
          format: password
          example: secret123

    AuthResponse:
      type: object
      required: [token, expires_at, user]
      properties:
        token:
          type: string
          description: JWT access-токен
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, email, name, created_at]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: user@example.com
        name:
          type: string
          example: Иван Петров
        created_at:
          type: string
          format: date-time

    Role:
      type: string
      enum: [owner, admin, member]

    InviteRole:
      type: string
      enum: [admin, member]

    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          example: Платформа

    Team:
      type: object
      required: [id, name, created_by, created_at]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Платформа
        created_by:
          type: integer
          format: int64
          example: 1
        created_at:
          type: string
          format: date-time

    TeamWithRole:
      type: object
      required: [id, name, created_by, created_at, role]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Платформа
        created_by:
          type: integer
          format: int64
          example: 1
        created_at:
          type: string
          format: date-time
        role:
          $ref: '#/components/schemas/Role'

    TeamsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamWithRole'

    InviteMemberRequest:
      type: object
      required: [user_id, role]
      properties:
        user_id:
          type: integer
          format: int64
          minimum: 1
          example: 2
        role:
          $ref: '#/components/schemas/InviteRole'

    TeamMember:
      type: object
      required: [team_id, user_id, role]
      properties:
        team_id:
          type: integer
          format: int64
          example: 1
        user_id:
          type: integer
          format: int64
          example: 2
        role:
          $ref: '#/components/schemas/Role'

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'

    ErrorBody:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          example: forbidden
        message:
          type: string
          example: недостаточно прав
        request_id:
          type: string
          example: 4f8c2f1b9a3e4d5f
        details:
          type: object
          additionalProperties:
            type: string
          example:
            name: не более 100 символов
